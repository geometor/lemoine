    <circle cx="392.00" cy="186.00" r="3.30" class="geom-point" data-ref="P" />
    <circle cx="488.00" cy="186.00" r="3.30" class="geom-point" data-ref="Q" />
    <circle cx="530.00" cy="99.68" r="3.30" class="geom-point-assert" data-ref="D" />
