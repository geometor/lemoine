    <path d="M 392.00 186.00 L 440.00 186.00 L 488.00 186.00" fill="none" class="geom-bold" marker-mid="url(#geom-tick-1)" />
    <path d="M 488.00 186.00 L 509.00 142.84 L 530.00 99.68" fill="none" class="geom-dashed" marker-mid="url(#geom-tick-1)" />
    <path d="M 416.85 93.27 A 96.00 96.00 0 0 1 486.54 202.67" fill="none" class="geom-arc" />
