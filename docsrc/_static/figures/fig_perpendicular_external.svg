    <circle cx="518.00" cy="186.00" r="3.30" class="geom-point" data-ref="B" />
    <circle cx="398.00" cy="96.00" r="3.30" class="geom-point-assert" data-ref="D" />
  </g>
  <g id="labels">
    <text x="166.00" y="63.00" text-anchor="middle" class="geom-label" data-ref="A">A</text>
    <text x="168.00" y="221.00" text-anchor="middle" class="geom-label" data-ref="A&#x27;">A&#x27;</text>
    <text x="64.00" y="155.00" text-anchor="middle" class="geom-label" data-ref="B">B</text>
    <text x="222.00" y="155.00" text-anchor="middle" class="geom-label" data-ref="C">C</text>
    <text x="143.00" y="131.00" text-anchor="middle" class="geom-label" data-ref="H">H</text>
    <text x="150.00" y="24.00" text-anchor="middle" class="geom-label-sm">XX.1 Off Line (I.12): 2 Circles, S = 9</text>
    <text x="387.00" y="204.00" text-anchor="middle" class="geom-label" data-ref="A">A</text>
    <text x="470.00" y="136.00" text-anchor="middle" class="geom-label" data-ref="O">O</text>
    <text x="528.00" y="204.00" text-anchor="middle" class="geom-label" data-ref="B">B</text>
