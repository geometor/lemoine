    <circle cx="154.00" cy="68.00" r="3.30" class="geom-point-accent" data-ref="A" />
    <circle cx="154.00" cy="208.00" r="3.30" class="geom-point-accent" data-ref="A&#x27;" />
    <circle cx="72.00" cy="138.00" r="3.30" class="geom-point" data-ref="B" />
