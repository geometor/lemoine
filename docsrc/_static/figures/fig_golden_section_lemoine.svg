  <g id="highlights" style="pointer-events: none;">
    <path d="M 309.00 206.00 L 309.00 197.00 L 300.00 197.00" fill="none" class="geom-ang-arc" />
  </g>
  <g id="points">
    <circle cx="201.11" cy="206.00" r="3.30" class="geom-point-accent" data-ref="E" />
    <circle cx="220.00" cy="206.00" r="3.30" class="geom-point" data-ref="A" />
    <circle cx="300.00" cy="206.00" r="3.30" class="geom-point" data-ref="M" />
    <circle cx="318.89" cy="206.00" r="3.60" class="geom-point-assert" data-ref="X" />
    <circle cx="380.00" cy="206.00" r="3.30" class="geom-point" data-ref="B" />
    <circle cx="300.00" cy="46.00" r="3.30" class="geom-point-accent" data-ref="C" />
  </g>
  <g id="labels">
    <text x="191.11" y="197.00" text-anchor="middle" class="geom-label" data-ref="E">E</text>
    <text x="220.00" y="225.00" text-anchor="middle" class="geom-label" data-ref="A">A</text>
    <text x="291.00" y="225.00" text-anchor="middle" class="geom-label" data-ref="M">M</text>
    <text x="338.89" y="196.00" text-anchor="middle" class="geom-label" data-ref="X">X (φ⁻¹)</text>
    <text x="390.00" y="225.00" text-anchor="middle" class="geom-label" data-ref="B">B</text>
    <text x="314.00" y="51.00" text-anchor="middle" class="geom-label" data-ref="C">C</text>
    <text x="290.00" y="20.00" text-anchor="middle" class="geom-label-sm">Problem XXXVI (Euclid II.11) — Golden Section in 1 Line &amp; 6 Circles (S = 18 vs. S = 25)</text>
    <text x="290.00" y="280.00" text-anchor="middle" class="geom-label-sm">MC = AB, MB = AB/2  ⇒  BC = (√5/2)·AB  ⇒  ME = AX = AB / φ</text>
  </g>
</svg>
