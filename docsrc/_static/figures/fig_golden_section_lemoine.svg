    <path d="M 278.12 126.00 A 98.89 98.89 0 0 1 317.92 219.76" fill="none" class="geom-assert-line" data-ref="A(ME)" />
  </g>
  <g id="graphics">
    <path d="M 65.00 206.00 L 285.00 206.00 L 505.00 206.00" fill="none" class="geom-line" />
