<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 230" width="620" height="230" class="euclid-graphic" data-graphic-id="fig_elementary_operations" data-proposition="Op.I-VIII">
  <defs>
    <marker id="geom-tick-1" viewBox="-2 -6 4 12" markerWidth="4" markerHeight="12" orient="auto">
      <line x1="0" y1="-4.5" x2="0" y2="4.5" stroke="var(--geom-fg)" stroke-width="1.4" />
    </marker>
    <marker id="geom-tick-2" viewBox="-4 -6 8 12" markerWidth="8" markerHeight="12" orient="auto">
      <line x1="-1.8" y1="-4.5" x2="-1.8" y2="4.5" stroke="var(--geom-fg)" stroke-width="1.4" />
      <line x1="1.8" y1="-4.5" x2="1.8" y2="4.5" stroke="var(--geom-fg)" stroke-width="1.4" />
    </marker>
    <marker id="geom-tick-3" viewBox="-6 -6 12 12" markerWidth="12" markerHeight="12" orient="auto">
      <line x1="-3.4" y1="-4.5" x2="-3.4" y2="4.5" stroke="var(--geom-fg)" stroke-width="1.4" />
      <line x1="0" y1="-4.5" x2="0" y2="4.5" stroke="var(--geom-fg)" stroke-width="1.4" />
      <line x1="3.4" y1="-4.5" x2="3.4" y2="4.5" stroke="var(--geom-fg)" stroke-width="1.4" />
    </marker>
  </defs>
  <style>
    :root {
      --geom-fg: #18181b;
      --geom-bg: #ffffff;
      --geom-point-stroke: #ffffff;
      --geom-poly-fill: #000000;
      --geom-accent: #c88a1e;
      --geom-assert: #16a34a;
    }
    .euclid-graphic {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-style: normal;
      font-weight: 700;
      background-color: var(--geom-bg);
    }
    .geom-line { stroke: var(--geom-fg); stroke-width: 1.8; stroke-linecap: round; fill: none; }
    .geom-bold { stroke: var(--geom-fg); stroke-width: 2.3; stroke-linecap: round; fill: none; }
    .geom-dashed { stroke: var(--geom-fg); stroke-width: 1.35; stroke-dasharray: 5, 3.5; stroke-linecap: round; fill: none; opacity: 0.78; }
    .geom-accent-line { stroke: var(--geom-accent); stroke-width: 2.15; stroke-linecap: round; fill: none; }
    .geom-assert-line { stroke: var(--geom-assert); stroke-width: 2.25; stroke-linecap: round; fill: none; }
    .geom-circle { stroke: var(--geom-fg); stroke-width: 1.55; fill: none; }
    .geom-arc { stroke: var(--geom-accent); stroke-width: 1.75; stroke-dasharray: 4.5, 3; stroke-linecap: round; fill: none; }
    .geom-ang-arc { stroke: var(--geom-assert); stroke-width: 1.7; stroke-linecap: round; fill: none; }
    .geom-polygon { fill: var(--geom-poly-fill); fill-opacity: 0.05; stroke: none; }
    .geom-polygon-accent { fill: var(--geom-accent); fill-opacity: 0.12; stroke: none; }
    .geom-point { fill: var(--geom-fg); stroke: var(--geom-point-stroke); stroke-width: 1.15; }
    .geom-point-accent { fill: var(--geom-accent); stroke: var(--geom-point-stroke); stroke-width: 1.15; }
    .geom-point-assert { fill: var(--geom-assert); stroke: var(--geom-point-stroke); stroke-width: 1.25; }
    .geom-label { font-size: 13px; font-weight: 700; fill: var(--geom-fg); user-select: none; }
    .geom-label-sm { font-size: 10.2px; font-weight: 700; fill: var(--geom-fg); opacity: 0.88; user-select: none; }
    .is-active { stroke-width: 3.1 !important; filter: drop-shadow(0 0 3px var(--geom-accent)); }
    @media (prefers-color-scheme: dark) {
      :root {
        --geom-fg: #d6cfc5;
        --geom-bg: #1e1e20;
        --geom-point-stroke: #1e1e20;
        --geom-poly-fill: #d6cfc5;
        --geom-accent: #e8b85a;
        --geom-assert: #5ec27e;
      }
    }
  </style>
  <g id="elements">
    <path d="M 32.00 157.42 L 152.00 112.25 L 272.00 67.07" fill="none" class="geom-assert-line" data-ref="AB" />
    <path d="M 65.00 145.00 L 150.00 113.00 L 235.00 81.00" fill="none" class="geom-bold" marker-mid="url(#geom-tick-1)" data-ref="AB" />
    <path d="M 336.00 148.00 L 459.00 148.00 L 582.00 148.00" fill="none" class="geom-line" data-ref="MN" />
    <circle cx="456.00" cy="114.00" r="62.00" fill="none" class="geom-accent-line" data-ref="O(AB)" />
    <path d="M 456.00 114.00 L 474.60 89.20 L 493.20 64.40" fill="none" class="geom-dashed" marker-mid="url(#geom-tick-1)" data-ref="OR" />
  </g>
  <g id="graphics">
    <path d="M 302.00 18.00 L 302.00 115.00 L 302.00 212.00" fill="none" class="geom-dashed" />
  </g>
  <g id="highlights" style="pointer-events: none;">
  </g>
  <g id="points">
    <circle cx="65.00" cy="145.00" r="3.80" class="geom-point-accent" data-ref="A" />
    <circle cx="235.00" cy="81.00" r="3.80" class="geom-point-accent" data-ref="B" />
    <circle cx="456.00" cy="114.00" r="3.80" class="geom-point-accent" data-ref="O" />
    <circle cx="493.20" cy="64.40" r="3.30" class="geom-point" data-ref="R" />
    <circle cx="404.15" cy="148.00" r="3.50" class="geom-point-assert" data-ref="M" />
    <circle cx="507.85" cy="148.00" r="3.50" class="geom-point-assert" data-ref="N" />
  </g>
  <g id="labels">
    <text x="61.00" y="165.00" text-anchor="middle" class="geom-label" data-ref="A">A (R₁)</text>
    <text x="241.00" y="71.00" text-anchor="middle" class="geom-label" data-ref="B">B (R₁)</text>
    <text x="152.00" y="26.00" text-anchor="middle" class="geom-label-sm">Ruler Join AB : 2R₁ + R₂  (S = 3, E = 2)</text>
    <text x="152.00" y="206.00" text-anchor="middle" class="geom-label-sm">R₁: align on point · R₂: trace straight line</text>
    <text x="436.00" y="108.00" text-anchor="middle" class="geom-label" data-ref="O">O (C₁)</text>
    <text x="515.20" y="59.40" text-anchor="middle" class="geom-label" data-ref="O(AB)">O(AB)</text>
    <text x="396.15" y="166.00" text-anchor="middle" class="geom-label" data-ref="M">M (C₂)</text>
    <text x="515.85" y="166.00" text-anchor="middle" class="geom-label" data-ref="N">N</text>
    <text x="460.00" y="26.00" text-anchor="middle" class="geom-label-sm">Circle O(AB) &amp; Segment Transfer : 2C₁ + C₂ + C₃  (S = 4)</text>
    <text x="460.00" y="206.00" text-anchor="middle" class="geom-label-sm">C₁: set on point · C₂: set on locus · C₃: trace circle</text>
  </g>
</svg>
